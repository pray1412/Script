# Duolingo - Quantumult X local rewrite
# Based on TAKAGIVEGETA/MyScripts/lingoDuo/lingoDuo.plugin
# Merge the rules and hostnames into the corresponding sections of your main config.
# Edit CONFIG at the top of lingoDuo.js to enable or disable individual features.

[rewrite_local]
# Max, XP boost, course unlock
^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+)\.duolingo\.(?:cn|com)\/2023-05-23\/(?:batch|users\/[^\/?#]+)(?:[?#]|$) url script-response-body https://raw.githubusercontent.com/pray1412/Script/main/lingoDuo/lingoDuo.js
# Challenge timer
^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+)\.duolingo\.(?:cn|com)\/[^?#]*\/live-ops-challenges(?:[/?#]|$) url script-response-body https://raw.githubusercontent.com/pray1412/Script/main/lingoDuo/lingoDuo.js
# Lesson and story sessions
^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+|stories)\.duolingo\.(?:cn|com)\/(?:[^?#]*\/sessions|api2\/stories)(?:[/?#]|$) url script-response-body https://raw.githubusercontent.com/pray1412/Script/main/lingoDuo/lingoDuo.js

[mitm]
hostname = ios-api-*.duolingo.com, ios-api-*.duolingo.cn, api*.duolingo.com, api*.duolingo.cn, stories.duolingo.com, stories.duolingo.cn
