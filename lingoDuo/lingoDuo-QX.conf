# Duolingo - Quantumult X local rewrite
# Based on TAKAGIVEGETA/MyScripts/lingoDuo/lingoDuo.plugin
# Copy 3 .qx.js files into iCloud Drive/Quantumult X/Scripts
# Paste the rewrite rules into [rewrite_local] of your main config,
# and append hostnames to the existing [mitm] hostname if present.
# To enable optional time modification / instant clear: uncomment their rules.

[rewrite_local]
# Duolingo Max + optional XP boost / unlock all (edit CONFIG in JS)
^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+)\.duolingo\.(?:cn|com)\/2023-05-23\/(?:batch|users\/[^\/?#]+)(?:[?#]|$) url script-response-body https://raw.githubusercontent.com/pray1412/Script/main/lingoDuo/lingoDuo-max.qx.js
# Optional: challenge time modification (edit CONFIG in JS)
# ^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+)\.duolingo\.(?:cn|com)\/.*\/live-ops-challenges url script-response-body https://raw.githubusercontent.com/pray1412/Script/main/lingoDuo/lingoDuo-time.qx.js
# Optional: instant clear (may not work on all lessons)
# ^https?:\/\/(?:ios-api-[a-z0-9-]+|api\d+|stories)\.duolingo\.(?:cn|com)\/(?:.*\/sessions|api2\/stories) url script-response-body https://raw.githubusercontent.com/pray1412/Script/main/lingoDuo/lingoDuo-clear.qx.js

[mitm]
hostname = ios-api-*.duolingo.com, ios-api-*.duolingo.cn, api*.duolingo.com, api*.duolingo.cn, stories.duolingo.com, stories.duolingo.cn
